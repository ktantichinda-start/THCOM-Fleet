<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THAICOM Fleet 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}
:root{
  color-scheme:dark;
  --bg:#05070d; --panel:rgba(11,16,27,.9); --line:#1c2537; --line2:#2a3650;
  --ink:#e7ecf4; --muted:#8793a8; --dim:#5b667b;
  --foil:#e2b451; --foil-2:#f3d48a;
  --ok:#5fd08a; --warn:#f2b544; --plan:#74c7f0; --off:#6f788a;
  --display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55;overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--foil);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(#070a12,#05070d)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.mark{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.14em;color:var(--ink)}
.mark b{color:var(--foil);font-weight:700}
.sub{color:var(--muted);font-size:13px}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes button{background:transparent;border:1px solid var(--line2);border-radius:4px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted);transition:all .15s}
.modes button:hover{color:var(--ink);border-color:var(--dim)}
.modes button.on,.modes button[aria-pressed="true"]{color:#1a1206;background:var(--foil);border-color:var(--foil)}
.stage{display:grid;grid-template-columns:1fr 360px;min-height:0}
.view{position:relative;min-height:0;overflow:hidden}
canvas#c{display:block;width:100%;height:100%;cursor:grab}
canvas#c:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;background:rgba(5,7,13,.72);border:1px solid var(--line2);border-radius:3px;padding:3px 7px;font-family:var(--display);font-size:12px;letter-spacing:.05em;white-space:nowrap;color:var(--ink)}
.lbl:hover{border-color:var(--foil);color:var(--foil-2)}
.lbl i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px}
.hint{position:absolute;left:16px;bottom:12px;font-size:12px;color:var(--dim);pointer-events:none}
.scale-note{position:absolute;right:16px;bottom:12px;font-size:12px;color:var(--dim);pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.1em}
.panel{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:20px 20px 24px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--foil);letter-spacing:.08em;text-transform:uppercase}
.panel h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;margin:4px 0 0;letter-spacing:.03em;text-wrap:balance}
.alias{color:var(--muted);font-family:var(--display);font-size:15px;margin-top:2px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid currentColor;width:fit-content}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-active{color:var(--ok)} .s-retiring{color:var(--warn)} .s-planned{color:var(--plan)} .s-retired{color:var(--off)}
.note{margin:0;color:#c9d1de;max-width:62ch}
.specs{margin:0;display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--line)}
.specs dt,.specs dd{margin:0;padding:8px 0;border-bottom:1px solid var(--line)}
.specs dt{color:var(--muted);font-size:12.5px;padding-right:14px;white-space:nowrap}
.specs dd{font-variant-numeric:tabular-nums}
.specs dd.mono{font-family:var(--mono);font-size:13px}
.orbit h2{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin:0 0 6px}
.orbit svg{width:100%;height:auto;display:block}
.disclaimer{font-size:12px;color:var(--dim);margin:0}
.rail{display:flex;gap:0;overflow-x:auto;border-top:1px solid var(--line);background:#070a12;padding-bottom:env(safe-area-inset-bottom,0px)}
.chip{flex:1 0 118px;text-align:left;background:transparent;border:0;border-right:1px solid var(--line);padding:10px 12px 11px;cursor:pointer;display:grid;gap:1px;position:relative;transition:background .15s}
.chip:hover{background:#0c1220}
.chip .n{font-family:var(--mono);font-size:11px;color:var(--dim)}
.chip .nm{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.04em}
.chip .bs{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.chip .bs i{width:6px;height:6px;border-radius:50%;flex:none}
.chip.on{background:#0e1526}
.chip.on::after{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--foil)}
.chip.on .nm{color:var(--foil-2)}
.dot-active{background:var(--ok)} .dot-retiring{background:var(--warn)} .dot-planned{background:var(--plan)} .dot-retired{background:var(--off)}
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .stage{grid-template-columns:1fr}
  .view{height:58vh;min-height:320px}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .rail{order:0}
  .scale-note{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="mark"><b>THAI</b>COM</span><span class="sub">ฝูงดาวเทียม THAICOM 1–10 · โมเดล 3 มิติ</span></div>
    <div class="modes">
      <button id="mSingle" class="on" type="button">ทีละดวง</button>
      <button id="mLine" type="button">เทียบขนาดทั้งฝูง</button>
      <button id="mRot" type="button" aria-pressed="true">หมุนอัตโนมัติ</button>
      <button id="mDeploy" type="button">กางแผงใหม่</button>
    </div>
  </header>
  <main class="stage">
    <div class="view" id="view">
      <canvas id="c" aria-label="โมเดล 3 มิติของดาวเทียม THAICOM"></canvas>
      <div id="labels"></div>
      <div class="loading" id="loading">กำลังโหลดโมเดล…</div>
      <div class="hint">ลากเพื่อหมุน · เลื่อน/บีบเพื่อซูม</div>
      <div class="scale-note" id="scaleNote" hidden>สัดส่วนระหว่างดวงโดยประมาณ</div>
    </div>
    <aside class="panel" id="panel"></aside>
  </main>
  <nav class="rail" id="rail" aria-label="เลือกดาวเทียม"></nav>
</div>
